<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CINTEL 2.0 Platform</title>
<style>
:root{
 --brand:#0B5CAD;--brand-700:#084A8C;--brand-50:#EAF3FC;--brand-100:#D3E6F8;
 --ink:#1B2733;--ink2:#4B5A6B;--muted:#7A8797;--line:#E2E8F0;--line2:#CBD5E1;--bg:#F4F7FA;--surface:#fff;
 --ok:#15803D;--okbg:#E7F6EC;--warn:#B45309;--warnbg:#FEF3E2;--info:#0369A1;--infobg:#E6F4FB;
 --nav:#0F2A47;--nav2:#173A60;--navtxt:#C9D8EA;
 --sh1:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);--sh2:0 8px 28px rgba(16,24,40,.16);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#E6EDF5;--ink2:#A9B7C7;--muted:#7F8EA0;--line:#243447;--line2:#35485E;--bg:#0B141E;--surface:#111E2C;--brand:#4C9BEA;--brand-700:#6FB1F2;--brand-50:#14304D;--brand-100:#1B4067;--okbg:#10301D;--warnbg:#3A2A10;--infobg:#0F2D40;--nav:#08121D;--nav2:#102236}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
/* header */
header{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:14px;padding:0 16px;background:linear-gradient(90deg,#0F2A47 0%,#0B5CAD 100%);color:#fff;position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;font-size:16px}
.brand i{width:28px;height:28px;border-radius:8px;background:#fff;color:var(--brand);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:14px}
.brand small{font-weight:500;opacity:.75;font-size:11.5px;display:block;margin-top:-2px}
.hsearch{flex:1;max-width:460px;margin-left:18px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:8px;height:34px;display:flex;align-items:center;gap:8px;padding:0 12px;text-align:left}
.hsearch:hover{background:rgba(255,255,255,.22)}
.hsearch kbd{margin-left:auto;font:11px/1 inherit;background:rgba(255,255,255,.18);border-radius:4px;padding:3px 6px}
.sp{flex:1}
.seg{display:inline-flex;background:rgba(255,255,255,.14);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;color:#fff;padding:6px 14px;border-radius:7px;font-weight:600;font-size:13px;opacity:.8}
.seg button[aria-pressed=true]{background:#fff;color:var(--brand-700);opacity:1;box-shadow:var(--sh1)}
.who{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-weight:700;font-size:12px}
/* layout */
.app{flex:1;display:flex;min-height:0}
nav{flex:0 0 232px;background:var(--nav);color:var(--navtxt);overflow:auto;padding:14px 10px;display:flex;flex-direction:column;gap:2px}
nav h6{margin:14px 10px 6px;font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:#7F97B3;font-weight:700}
nav h6:first-child{margin-top:2px}
nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:var(--navtxt);text-decoration:none;font-weight:500;border:0;background:transparent;width:100%;text-align:left}
nav a svg{flex:0 0 18px;opacity:.85}
nav a:hover{background:var(--nav2);color:#fff}
nav a[aria-current=page]{background:#fff;color:var(--brand-700);font-weight:700;box-shadow:var(--sh1)}
nav a[aria-current=page] svg{opacity:1}
nav a .tag{margin-left:auto;font-size:10px;font-weight:700;padding:2px 6px;border-radius:99px;background:rgba(255,255,255,.14);color:#fff}
nav a[aria-current=page] .tag{background:var(--brand-50);color:var(--brand-700)}
.navfoot{margin-top:auto;font-size:11.5px;color:#7F97B3;padding:12px 10px 4px;line-height:1.5}
/* work area */
.work{flex:1;min-width:0;display:flex;flex-direction:column}
.bar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.crumb{font-size:12.5px;color:var(--muted)}
.crumb b{color:var(--ink);font-size:15px;display:block;margin-top:1px}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
.badge.an{background:var(--warnbg);color:var(--warn)}.badge.cl{background:var(--infobg);color:var(--info)}
.bar .sp{flex:1}
.b{border:1px solid var(--line2);background:var(--surface);color:var(--brand);padding:7px 12px;border-radius:8px;font-weight:600;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.b:hover{background:var(--brand-50);border-color:var(--brand)}
.b.p{background:var(--brand);color:#fff;border-color:var(--brand)}.b.p:hover{background:var(--brand-700)}
.view{flex:1;min-height:0;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);pointer-events:none}
.home{position:absolute;inset:0;overflow:auto;padding:26px 28px 60px}
.wrap{max-width:1120px;margin:0 auto}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.2px}
.sub{color:var(--ink2);margin:0 0 22px}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:0 0 26px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh1);overflow:hidden}
.step{padding:16px 18px;position:relative;border-right:1px solid var(--line);cursor:pointer;background:var(--surface);text-align:left;border-top:0;border-bottom:0;border-left:0}
.step:last-child{border-right:0}
.step:hover{background:var(--brand-50)}
.step .n{width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;margin-bottom:8px}
.step b{display:block;margin-bottom:2px}.step span{color:var(--ink2);font-size:12.5px;line-height:1.4;display:block}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:26px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--sh1);text-align:left;display:flex;flex-direction:column;gap:8px;transition:box-shadow .15s,transform .15s,border-color .15s;color:inherit}
.card:hover{box-shadow:var(--sh2);transform:translateY(-2px);border-color:var(--brand)}
.card .ic{width:36px;height:36px;border-radius:10px;background:var(--brand-50);color:var(--brand);display:grid;place-items:center}
.card b{font-size:15px}.card p{margin:0;color:var(--ink2);line-height:1.45;font-size:13px}
.card .go{margin-top:auto;color:var(--brand);font-weight:600;font-size:13px}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.tip{background:var(--surface);border:1px dashed var(--line2);border-radius:12px;padding:12px 14px;color:var(--ink2);font-size:13px;line-height:1.5}
.tip b{color:var(--ink)}
/* palette */
#pal{position:fixed;inset:0;background:rgba(10,20,32,.5);display:none;align-items:flex-start;justify-content:center;padding-top:12vh;z-index:50}
#pal.on{display:flex}
.pbox{width:min(560px,92vw);background:var(--surface);border-radius:14px;box-shadow:var(--sh2);overflow:hidden}
.pbox input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font:inherit;font-size:15px;background:transparent;color:var(--ink);outline:none}
.plist{max-height:50vh;overflow:auto;padding:6px}
.plist button{display:flex;width:100%;gap:12px;align-items:center;border:0;background:transparent;color:var(--ink);padding:10px 12px;border-radius:8px;text-align:left}
.plist button.sel,.plist button:hover{background:var(--brand-50)}
.plist small{margin-left:auto;color:var(--muted)}
@media (max-width:900px){nav{flex-basis:60px}nav a span,nav h6,.navfoot,nav a .tag{display:none}nav a{justify-content:center}.flow{grid-template-columns:1fr 1fr}.hsearch span{display:none}.brand small{display:none}}
@media (max-width:560px){.flow{grid-template-columns:1fr}.bar{flex-wrap:wrap}}
</style></head>
<body>
<header>
 <div class="brand"><i>C</i><div>CINTEL <small>Competitive Intelligence · 2.0</small></div></div>
 <button class="hsearch" id="hs" aria-label="Search modules and actions"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Jump to a module or action…</span><kbd>Ctrl K</kbd></button>
 <div class="sp"></div>
 <div class="seg" role="group" aria-label="Indication" style="margin-right:6px"><button id="iCrc" aria-pressed="true">CRC</button><button id="iSle" aria-pressed="false" title="Original fictional SLE sample set">SLE sample</button></div>
 <div class="seg" role="group" aria-label="View as"><button id="rAn" aria-pressed="true">Analyst</button><button id="rCl" aria-pressed="false">Client</button></div>
 <div class="who" title="PharmSight Research &amp; Analytics">PS</div>
</header>
<div class="app">
 <nav id="nav" aria-label="Modules"></nav>
 <div class="work">
  <div class="bar" id="bar"></div>
  <div class="view" id="view"></div>
 </div>
</div>
<div id="pal"><div class="pbox"><input id="pin" placeholder="Type to jump… (news, pipeline, compare, hiring, messaging, landscape)" autocomplete="off"><div class="plist" id="plist"></div></div></div>

<script>
const IC={
 home:'<path d="M3 11 12 3l9 8v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 news:'<path d="M4 5h13v14H6a2 2 0 0 1-2-2zM17 9h3v8a2 2 0 0 1-2 2M8 9h5M8 13h5"/>',
 pipe:'<circle cx="5" cy="6" r="2"/><circle cx="5" cy="18" r="2"/><circle cx="19" cy="12" r="2"/><path d="M7 6h4a4 4 0 0 1 4 4v0M7 18h4a4 4 0 0 0 4-4v0"/>',
 land:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
 cmp:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',
 hire:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M17 5a3.5 3.5 0 0 1 0 6M18.5 14.5a6 6 0 0 1 3 5.5"/>',
 msg:'<path d="M4 5h16v11H9l-5 4z"/>',
 wb:'<path d="M14.7 6.3a4 4 0 0 0-5 5L3 18l3 3 6.7-6.7a4 4 0 0 0 5-5l-2.4 2.4-2.6-.6-.6-2.6z"/>'
};
const svg=k=>`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;
/* module registry: each module declares which file serves each role */
const MODS=[
 {id:'news',grp:'Monitor',ic:'news',name:'News Portal',desc:'Curated, tagged news for your watchlist. Analysts triage and publish from Compose; clients read the finished feed.',an:'cintel-news-portal.html',cl:'cintel-news-portal.html?client=1',step:1,next:'pipeline',nextWhy:'Check which assets in the news are new to the landscape',kw:'news compose triage publish tags'},
 {id:'pipeline',grp:'Monitor',ic:'pipe',name:'Pipeline Tracking',desc:'Match new trials to assets, resolve code names, flag assets missing from the landscape, and add them after approval.',an:'cintel-pipeline-tracking.html',cl:null,step:1,next:'landscape',nextWhy:'See approved changes on the landscape',kw:'trials assets aliases entity resolution registry new asset'},
 {id:'landscape',grp:'Analyse',ic:'land',name:'Landscape & Asset 360',desc:'Filter the competitive landscape, select assets, and open an Asset 360 with cited answers and one-click memo or slides.',an:'cintel-landscape-asset360.html',cl:'cintel-landscape-asset360.html',step:2,next:'compare',nextWhy:'Compare the selected assets head to head',kw:'landscape asset 360 memo slides moa'},
 {id:'compare',grp:'Analyse',ic:'cmp',name:'Data Comparison',desc:'Compare up to five trials side by side. AI reads publications or files and fills endpoints; every value is quote-checked.',an:'cintel-data-comparison.html',cl:'cintel-comparison-client.html',step:2,next:'messaging',nextWhy:'Understand how competitors position these results',kw:'compare trials endpoints data extraction cross trial'},
 {id:'workbench',grp:'Analyse',ic:'wb',name:'Comparison Workbench',desc:'Full analyst workbench for building and curating comparison packs that clients see.',an:'cintel-comparison-analyst.html',cl:null,step:2,analystOnly:true,kw:'workbench comparison pack bullseye'},
 {id:'hiring',grp:'Characterise',ic:'hire',name:'Hiring Signals',desc:'Turn job listings into strategic signals: functions, geographies and capabilities a competitor is building.',an:'cintel-hiring-analyst.html',cl:'cintel-hiring-client.html',step:3,next:'messaging',nextWhy:'Pair hiring signals with messaging shifts',kw:'hiring jobs signals careers',noCrc:true},
 {id:'messaging',grp:'Characterise',ic:'msg',name:'Messaging & Positioning',desc:'Capture brand and website claims, compare positioning across competitors, track change over time.',an:'cintel-messaging-analyst.html',cl:'cintel-messaging-client.html',step:3,kw:'messaging positioning brand website claims',noCrc:true}
];
const FLOW=[
 ['Monitor','Pick up news and new trials automatically; approve what matters.','news'],
 ['Analyse','Explore the landscape, open an Asset 360, compare trials.','landscape'],
 ['Characterise','Hiring and messaging signals show competitor intent.','hiring'],
 ['Deliver','Publish to the client portal or draft a memo or slides in one click.','news']
];
let role='an',ind='crc';try{role=localStorage.getItem('cintel.role')||'an';ind=localStorage.getItem('cintel.ind')||'crc'}catch(e){}
const path=f=>(ind==='crc'?'modules/crc/':'modules/')+f;
const $=id=>document.getElementById(id);
const avail=m=>(role==='cl'?m.cl:m.an)!=null&&!(role==='cl'&&m.analystOnly)&&!(ind==='crc'&&m.noCrc);
const cur=()=>location.hash.slice(1)||'home';

function renderNav(){
 const c=cur();let h=`<a href="#home" ${c==='home'?'aria-current="page"':''}>${svg('home')}<span>Home</span></a>`;
 let last='';
 MODS.filter(avail).forEach(m=>{
  if(m.grp!==last){h+=`<h6>${m.grp}</h6>`;last=m.grp}
  h+=`<a href="#${m.id}" ${c===m.id?'aria-current="page"':''}>${svg(m.ic)}<span>${m.name}</span></a>`;
 });
 h+=`<div class="navfoot">${role==='an'?'Analyst view: you can edit, approve and publish.':'Client view: read-only, curated by your analyst team.'}</div>`;
 $('nav').innerHTML=h;
 $('rAn').setAttribute('aria-pressed',role==='an');$('rCl').setAttribute('aria-pressed',role==='cl');$('iCrc').setAttribute('aria-pressed',ind==='crc');$('iSle').setAttribute('aria-pressed',ind==='sle');
}
function go(id){location.hash='#'+id}
function renderBar(m){
 if(!m){$('bar').innerHTML=`<div class="crumb">CINTEL<b>Home</b></div><span class="badge ${role}">${role==='an'?'Analyst':'Client'}</span>`;return}
 const f=role==='cl'?m.cl:m.an;let nx=MODS.find(x=>x.id===m.next&&avail(x));if(!nx&&m.next){const o=MODS.find(x=>x.id===m.next);nx=o&&MODS.find(x=>x.id===o.next&&avail(x))}
 $('bar').innerHTML=`<div class="crumb">${m.grp} · ${ind==="crc"?"Colorectal cancer":"SLE sample"}<b>${m.name}</b></div><span class="badge ${role}">${role==='an'?'Analyst':'Client'}</span><div class="sp"></div>
  <a class="b" href="${path(f)}" target="_blank" rel="noopener" title="Open this module on its own page">Open standalone ↗</a>
  ${nx?`<button class="b p" id="nxt" title="${nx.nextWhy||m.nextWhy}">Next: ${nx.name} →</button>`:''}`;
 const n=$('nxt');if(n)n.onclick=()=>go(nx.id);
}
function renderView(){
 const c=cur(),m=MODS.find(x=>x.id===c);
 if(!m||!avail(m)){ // home or not available for this role
  if(m&&!avail(m)){go('home');return}
  renderBar(null);renderHome();return}
 renderBar(m);const f=path(role==='cl'?m.cl:m.an);
 const v=$('view');const ex=v.querySelector('iframe');
 if(ex&&ex.dataset.src===f)return;
 v.innerHTML=`<div class="loading">Loading ${m.name}…</div><iframe title="${m.name}" data-src="${f}" src="${f}"></iframe>`;
 v.querySelector('iframe').addEventListener('load',()=>{const l=v.querySelector('.loading');if(l)l.remove()});
}
function renderHome(){
 const ms=MODS.filter(avail);
 $('view').innerHTML=`<div class="home"><div class="wrap">
 <h1>${role==='an'?'Good to see you, analyst team':'Your competitive intelligence workspace'}</h1>
 <p class="sub">${role==='an'?'Follow the flow left to right: monitor, analyse, characterise, deliver. Nothing reaches clients until you approve it.':'Everything here is curated and verified by your PharmSight analyst team.'}</p>
 <div class="flow" role="list">${FLOW.map((s,i)=>ind==='crc'&&i===2?['Characterise','Hiring and messaging signals are built for the SLE sample only. Switch to it to see them.','compare']:s).map((s,i)=>`<button class="step" role="listitem" data-go="${s[2]}"><div class="n">${i+1}</div><b>${s[0]}</b><span>${s[1]}</span></button>`).join('')}</div>
 <h2>${role==='an'?'Modules':'What you can explore'}</h2>
 <div class="grid">${ms.map(m=>`<button class="card" data-go="${m.id}"><div class="ic">${svg(m.ic)}</div><b>${m.name}</b><p>${m.desc}</p><span class="go">Open →</span></button>`).join('')}</div>
 ${ind==='crc'?`<h2>CRC demo dataset</h2><div class="tips"><div class="tip"><b>309 landscape assets</b> from Phase I to Marketed, in 12 mechanism categories, built from the PharmSight CRC pipeline file.</div><div class="tip"><b>409 registered trials</b> feed Pipeline Tracking and each Asset 360. Many were left unlinked on purpose so the queue has real matches and gaps to resolve.</div><div class="tip"><b>32 comparison records</b> across first line, second line, third line and adjuvant, with regulatory status, PFS, OS and hazard ratios.</div><div class="tip"><b>18 news items</b> drawn from the same file, plus nine sample articles to triage in Compose. Hiring and Messaging are only built for the SLE sample.</div></div>`:''}
 <h2>Good to know</h2>
 <div class="tips">
  <div class="tip"><b>Every number has a source.</b> Extracted values carry a verbatim quote that is machine-checked against the text. A ⚠ means check it before using.</div>
  <div class="tip"><b>Humans stay in control.</b> New assets, landscape updates and published news all wait for analyst approval, and can be undone.</div>
  <div class="tip"><b>Quick navigation.</b> Press <b>Ctrl&nbsp;K</b> anywhere to jump to a module. Use <b>Next</b> at the top to follow the workflow.</div>
 </div></div></div>`;
 $('view').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
}
function render(){renderNav();renderView();document.title=(MODS.find(x=>x.id===cur())?.name||'Home')+' · CINTEL 2.0'}
function setInd(i){ind=i;try{localStorage.setItem('cintel.ind',i)}catch(e){}$('view').innerHTML='';render()}
function setRole(r){role=r;try{localStorage.setItem('cintel.role',r)}catch(e){}$('view').innerHTML='';render()}
$('iCrc').onclick=()=>setInd('crc');$('iSle').onclick=()=>setInd('sle');$('rAn').onclick=()=>setRole('an');$('rCl').onclick=()=>setRole('cl');
window.addEventListener('hashchange',render);
/* command palette */
let sel=0,items=[];
function pal(open){$('pal').classList.toggle('on',open);if(open){$('pin').value='';fill('');$('pin').focus()}}
function fill(q){q=q.toLowerCase();
 items=[{n:'Home',d:'Overview and workflow',id:'home'}].concat(MODS.filter(avail).map(m=>({n:m.name,d:m.grp,id:m.id,k:m.kw+' '+m.desc})));
 if(role==='an')items.push({n:'Switch to Client view',d:'See what clients see',act:()=>setRole('cl')});else items.push({n:'Switch to Analyst view',d:'Back to the workbench',act:()=>setRole('an')});
 items=items.filter(i=>!q||(i.n+' '+(i.k||'')).toLowerCase().includes(q));sel=0;
 $('plist').innerHTML=items.map((i,x)=>`<button class="${x===0?'sel':''}" data-i="${x}">${i.n}<small>${i.d}</small></button>`).join('')||'<div style="padding:14px;color:var(--muted)">No match</div>';
 $('plist').querySelectorAll('button').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
}
function pick(i){const it=items[i];if(!it)return;pal(false);it.act?it.act():go(it.id)}
$('pin').addEventListener('input',e=>fill(e.target.value));
$('pin').addEventListener('keydown',e=>{
 const bs=[...$('plist').querySelectorAll('button')];
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sel=(sel+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length;bs.forEach((b,x)=>b.classList.toggle('sel',x===sel))}
 else if(e.key==='Enter'){pick(sel)}else if(e.key==='Escape')pal(false)});
$('pal').addEventListener('click',e=>{if(e.target.id==='pal')pal(false)});
$('hs').onclick=()=>pal(true);
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();pal(true)}});
addEventListener('message',e=>{const d=e.data||{};if(d.cintel==='palette')pal(true);if(d.cintelGo)go(d.cintelGo)});
render();
</script></body></html>
