*{box-sizing:border-box}

.hdr{display:flex;height:69px}
.logo{flex:0 0 216px;background:#fff}.logo img{display:block;width:216px;height:69px}

.ind.on{background:#A7ADB0;color:#fff}
.user{position:absolute;right:30px;top:0;bottom:0;display:flex;align-items:center;gap:12px;color:#fff;font-size:18px}

.layout{display:flex;align-items:stretch;min-height:calc(100vh - 69px)}
.side{flex:0 0 155px;background:#fff;padding-top:12px}

.i0{background-position:0 0}.i1{background-position:-48px 0}.i2{background-position:-96px 0}.i3{background-position:-144px 0}.i4{background-position:-192px 0}.i5{background-position:-240px 0}.i6{background-position:-288px 0}.i7{background-position:-336px 0}.i8{background-position:-384px 0}
.main{flex:1;min-width:0;padding:22px 26px 60px 17px}
.pagehead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
h1.pt{font-size:24px;font-weight:400;color:#0559A8;margin:0}
.acts{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.upd{font-size:13px;font-style:italic;font-weight:700;color:#111827}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border-radius:6px;border:1.5px solid #0056A6;background:#fff;color:#0056A6;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#F0F7FF}
.btn.blue{background:#0056A6;color:#fff}.btn.blue:hover{background:#004a91}
.btn.green{background:#15803D;border-color:#15803D;color:#fff}.btn.green:hover{background:#116a32}
.btn.red{background:#DC2626;border-color:#DC2626;color:#fff}
.btn.ghost{border-color:#BABABA;color:#374151;font-weight:500}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.card{background:#fff;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.14)}
.lbl{font-size:12px;font-weight:600;color:#6B7280;text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}
input[type=text],input[type=search],select,textarea{width:100%;padding:8px 12px;border:1px solid #BABABA;border-radius:4px;background:#fff}
textarea{resize:vertical;line-height:1.5}
.pillx{display:inline-block;font-size:11.5px;font-weight:600;border-radius:10px;padding:2px 10px;background:#E5E7EB;color:#374151;white-space:nowrap}
.pillx.ok{background:#DCFCE7;color:#166534}.pillx.warn{background:#FEF3C7;color:#92400E}.pillx.info{background:#DBEAFE;color:#1E40AF}.pillx.bad{background:#FEE2E2;color:#991B1B}
.mute{color:#6B7280}.small{font-size:12.5px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid #D1D5DB;border-top-color:#0056A6;border-radius:50%;animation:sp .7s linear infinite;margin-right:8px;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;z-index:50}
#toast.on{opacity:1}

</style><style id="cintel-ds">/* CINTEL design-system layer v1 — tokens + component polish (injected into every module) */
:root{
 --c-brand:#0B5CAD;--c-brand-700:#084A8C;--c-brand-50:#EAF3FC;--c-brand-100:#D3E6F8;
 --c-ink:#1B2733;--c-ink-2:#4B5A6B;--c-muted:#7A8797;
 --c-line:#E2E8F0;--c-line-2:#CBD5E1;--c-bg:#F4F7FA;--c-surface:#fff;
 --c-ok:#15803D;--c-ok-bg:#E7F6EC;--c-warn:#B45309;--c-warn-bg:#FEF3E2;--c-bad:#B91C1C;--c-bad-bg:#FDECEC;--c-info:#0369A1;--c-info-bg:#E6F4FB;

 --sh-2:0 4px 14px rgba(16,24,40,.10);
 --focus:0 0 0 3px rgba(11,92,173,.28);
}
html,body{background:var(--c-bg)!important;color:var(--c-ink);font-family:Inter,"Segoe UI","Open Sans",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.main{background:transparent}
/* cards */
.card{border:1px solid var(--c-line);border-radius:var(--r-lg)!important;box-shadow:var(--sh-1)!important;background:var(--c-surface)}
/* buttons */
.btn{border-radius:var(--r-sm)!important;font-weight:600;letter-spacing:.1px;transition:background .15s,box-shadow .15s,transform .05s;border:1px solid transparent}
.btn:active{transform:translateY(1px)}
.btn,.btn.blue{background:var(--c-brand)!important;color:#fff!important}
.btn:hover,.btn.blue:hover{background:var(--c-brand-700)!important}
.btn.green{background:var(--c-ok)!important}.btn.green:hover{filter:brightness(.92)}
.btn.red{background:var(--c-bad)!important}.btn.red:hover{filter:brightness(.92)}
.btn.ghost{background:#fff!important;color:var(--c-brand)!important;border-color:var(--c-line-2)!important}
.btn.ghost:hover{background:var(--c-brand-50)!important;border-color:var(--c-brand)!important}
.btn[disabled],.btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.3)}
/* inputs */
input[type=text],input[type=search],input[type=url],input[type=number],input:not([type]),select,textarea{border:1px solid var(--c-line-2)!important;border-radius:var(--r-sm)!important;background:#fff;color:var(--c-ink);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none!important;border-color:var(--c-brand)!important;box-shadow:var(--focus)}
:focus-visible{outline:2px solid var(--c-brand);outline-offset:2px}
button:focus-visible{outline:2px solid var(--c-brand);outline-offset:2px}
/* tables */
table{border-collapse:separate;border-spacing:0}
th{background:#F1F5F9!important;color:var(--c-ink-2)!important;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:700}
tbody tr:hover td{background:var(--c-brand-50)}
/* pills: consistent semantic colours */
.pillx{border-radius:999px!important;font-weight:600}
/* scrollbars */
*{scrollbar-width:thin;scrollbar-color:var(--c-line-2) transparent}
/* toast */
#toast,.toast{border-radius:var(--r-md)!important;box-shadow:var(--sh-2)!important}
/* embedded in platform hub: hub supplies header + nav */
html.emb .hdr,html.emb .side{display:none!important}
html.emb .layout{min-height:100vh!important}
html.emb .main{padding-top:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let _uid=0; const nid=p=>p+Date.now().toString(36)+(++_uid);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),3000)}
async function claude({system,user,tools}){
  let messages=[{role:'user',content:user}];const texts=[];
  for(let turn=0;turn<3;turn++){
    const body={model:'claude-sonnet-4-6',max_tokens:1000,system,messages}; if(tools)body.tools=tools;
    let res=null,last=null;
    for(let a=0;a<4;a++){
      try{
        const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        if(r.ok){res=r;break}
        const t=await r.text().catch(()=>'');last=new Error('API '+r.status+(t?': '+t.slice(0,140):''));
        if(![429,500,502,503,529].includes(r.status))throw last;
      }catch(e){last=e;if(/^API (?!429|5)/.test(e.message))throw e}
      await sleep(1500*(a+1));
    }
    if(!res)throw last||new Error('API request failed');
    const data=await res.json();
    for(const b of data.content||[])if(b.type==='text')texts.push(b.text);
    if(data.stop_reason==='pause_turn'){messages=[...messages,{role:'assistant',content:data.content}];continue}
    break;
  }
  return texts.join('\n');
}
// JSON Lines: one JSON array per line. A truncated last line is simply dropped.
function parseLines(raw){const out=[];for(let line of String(raw).split(/\r?\n/)){line=line.trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim().replace(/,$/,'');if(!line.startsWith('['))continue;try{const a=JSON.parse(line);if(Array.isArray(a))out.push(a)}catch(e){}}return out}
async function storeSet(k,v){try{if(window.storage)await window.storage.set(k,JSON.stringify(v))}catch(e){}}
async function storeGet(k){try{if(window.storage){const r=await window.storage.get(k);if(r&&r.value)return JSON.parse(r.value)}}catch(e){}return null}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Copied');return}catch(e){}
  const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copied')}catch(_){toast('Copy blocked - select the text manually')}ta.remove()}
function downloadText(name,text,mime){const b=new Blob([text],{type:mime||'text/plain'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Download started (if blocked, use Copy)')}
function bindNav(){document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>{if(!b.classList.contains('on'))toast('Other CINTEL modules are not part of this working file')}))}
function bindIndication(cb){document.querySelectorAll('.ind').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.ind').forEach(x=>x.classList.toggle('on',x===b));cb(b.dataset.ind)}))}
const csvEsc=v=>{v=String(v??'');return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function parseCSV(text){const rows=[];let row=[],f='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x!==''))rows.push(row);row=[]}else f+=c}row.push(f);if(row.some(x=>x!==''))rows.push(row);return rows}

const DATA=/*MESSAGING_DATA_START*/{"schema": "cintel.messaging.bundle.v1", "published": {"at": "2026-10-06T09:00:00Z", "version": 1, "by": "PharmSight analyst team", "note": "Demo build (fictional brands and claims)"}, "datasets": [{"id": "sle", "area": "SLE", "title": "SLE messaging & positioning (illustrative, fictional data)", "source_line": "Illustrative fictional sample data", "sources": [{"id": "P1", "label": "Brand Alpha efficacy page (fictional)", "page": "Efficacy page", "url": "", "brand": "Brand Alpha"}, {"id": "P2", "label": "Brand Beta patient site (fictional)", "page": "Patient site", "url": "", "brand": "Brand Beta"}, {"id": "P3", "label": "Brand Gamma homepage (fictional)", "page": "Homepage", "url": "", "brand": "Brand Gamma"}], "brands": [{"id": "brand-alpha-hcp", "brand": "Brand Alpha", "company": "Company A", "asset": "AAA-101", "audience": "HCP", "positioning": "A B-cell-targeted biologic with trial-proven control of lupus disease activity.", "tagline": "Proven control of lupus disease activity", "tone": ["Scientific", "Direct"], "differentiators": ["Phase 2 SRI-4 data at Week 52", "BAFF-targeted mechanism"], "cta": ["Request a representative visit", "Download prescribing information"], "captured": "2026-10-01", "claims": [{"id": "c1", "text": "54.2% achieved SRI-4 response at Week 52 versus 38.1% on placebo", "cat": "Efficacy", "ev": "Clinical trial data", "q": "54.2% of patients on Brand Alpha achieved an SRI-4 response", "ok": true, "ver": true, "src": "P1"}, {"id": "c2", "text": "Targets BAFF to reduce autoreactive B cells", "cat": "Mechanism / science", "ev": "Mechanism claim", "q": "Targeting BAFF to reduce autoreactive B cells", "ok": true, "ver": true, "src": "P1"}, {"id": "c3", "text": "Once-every-4-weeks infusion", "cat": "Convenience & administration", "ev": "Unsupported", "q": "once-every-4-weeks infusion", "ok": true, "ver": true, "src": "P1"}, {"id": "c4", "text": "Safety profile consistent with standard immunomodulators", "cat": "Safety & tolerability", "ev": "Unsupported", "q": "Safety profile consistent with standard immunomodulators", "ok": true, "ver": true, "src": "P1"}]}, {"id": "brand-beta-patient", "brand": "Brand Beta", "company": "Company B", "asset": "BBB-220", "audience": "Patient", "positioning": "A once-monthly self-injection that helps people with lupus feel in control of their days.", "tagline": "Take back your days", "tone": ["Empowering", "Reassuring"], "differentiators": ["Once-monthly self-injection", "Patient support team"], "cta": ["Talk to your rheumatologist"], "captured": "2026-10-01", "claims": [{"id": "c5", "text": "Self-injection given just once a month", "cat": "Convenience & administration", "ev": "Unsupported", "q": "a self-injection given just once a month", "ok": true, "ver": true, "src": "P2"}, {"id": "c6", "text": "Patients felt more in control", "cat": "Patient outcomes & quality of life", "ev": "Testimonial", "q": "Patients told us they felt more in control", "ok": true, "ver": true, "src": "P2"}, {"id": "c7", "text": "Support team helps with insurance and copay questions", "cat": "Access & support", "ev": "Unsupported", "q": "can help with insurance and copay questions", "ok": true, "ver": true, "src": "P2"}, {"id": "c8", "text": "Blocks the interferon signal that drives lupus", "cat": "Mechanism / science", "ev": "Mechanism claim", "q": "blocking the interferon signal that drives lupus", "ok": true, "ver": true, "src": "P2"}]}, {"id": "brand-gamma-hcp", "brand": "Brand Gamma", "company": "Company G", "asset": "GGG-310", "audience": "HCP", "positioning": "The first oral option for active lupus, built for adherence and simplicity.", "tagline": "Simplicity, by mouth", "tone": ["Direct", "Aspirational"], "differentiators": ["Oral once-daily", "No infusion visits"], "cta": ["Order samples", "Register for the HCP programme"], "captured": "2026-10-02", "claims": [{"id": "c9", "text": "Oral once-daily dosing", "cat": "Convenience & administration", "ev": "Unsupported", "q": "Oral once-daily dosing", "ok": true, "ver": true, "src": "P3"}, {"id": "c10", "text": "49.0% SRI-4 response at Week 24 (90 mg) versus 33.0% on placebo", "cat": "Efficacy", "ev": "Clinical trial data", "q": "49.0% SRI-4 response at Week 24", "ok": true, "ver": true, "src": "P3"}, {"id": "c11", "text": "Selective TYK2 inhibition", "cat": "Mechanism / science", "ev": "Mechanism claim", "q": "Selective TYK2 inhibition", "ok": true, "ver": true, "src": "P3"}]}]}]}/*MESSAGING_DATA_END*/;
const B=DATA||{schema:'cintel.messaging.bundle.v1',published:{at:null,version:0},datasets:[]};
const CATS=['Efficacy','Safety & tolerability','Convenience & administration','Patient outcomes & quality of life','Mechanism / science','Access & support','Real-world evidence','Guidelines & endorsements'];
const CC=['#0056A6','#B45309','#0F766E','#7C3AED','#4B5563','#BE185D','#0369A1','#65A30D'];
const STRONG=['Clinical trial data','Real-world evidence','Guideline / endorsement'];
const S={di:0,aud:'',sel:[],q:'',ev:null};
const ds=()=>B.datasets[S.di];
const fmt=iso=>{if(!iso)return '';const d=new Date(iso);return isNaN(d)?iso:d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})};
const brands=()=>{const d=ds();return d?d.brands.filter(b=>(!S.aud||b.audience===S.aud)&&(!S.q||(b.brand+' '+b.company).toLowerCase().includes(S.q.toLowerCase()))):[]};
function pills(){const w=document.querySelector('.inds');w.innerHTML=B.datasets.map((d,i)=>`<button class="ind${i===S.di?' on':''}" data-i="${i}" type="button">${esc(d.area)}</button>`).join('');w.querySelectorAll('.ind').forEach(b=>b.addEventListener('click',()=>{S.di=+b.dataset.i;S.sel=[];S.ev=null;all()}))}
function head(){const d=ds();$('updTxt').textContent=B.published.at?`Last Updated : ${fmt(B.published.at)} · v${B.published.version}`:'';$('empty').hidden=!!d;$('root').hidden=!d;if(!d)return;
  $('subTxt').textContent=`${d.title}. Compare how brands position themselves and which claims they make, by audience. Pick 2–4 brands. Claims are as stated on public brand pages; the evidence type is an analyst classification, not a regulatory judgement.`;
  $('footL').textContent='Source: '+(d.source_line||'Public brand websites captured by PharmSight analysts');$('footR').textContent='Claims are quoted from brand pages · analyst-classified'}
function picker(){const d=ds();if(!d)return;S.sel=S.sel.filter(id=>d.brands.some(b=>b.id===id));$('selN').textContent=S.sel.length;
  $('rlist').innerHTML=brands().length?brands().map(b=>{const sel=S.sel.includes(b.id),dis=!sel&&S.sel.length>=4;return `<label class="rc${sel?' sel':''}${dis?' dis':''}"><input type="checkbox" data-id="${esc(b.id)}"${sel?' checked':''}${dis?' disabled':''}><span><div class="rn">${esc(b.brand)}</div><div class="rs">${esc(b.company)} · ${esc(b.audience)} · ${b.claims.length} claims</div></span></label>`}).join(''):'<div class="lp">No brands match.</div>'}
function table(){const d=ds();if(!d)return;const R=S.sel.map(id=>d.brands.find(b=>b.id===id)).filter(Boolean);const el=$('body');$('tTitle').textContent=R.length?`Comparing ${R.length} brand${R.length>1?'s':''}`:'Messaging comparison';
  if(!R.length){el.innerHTML='<div class="lp" style="padding:44px"><b style="display:block;color:#374151;font-size:16px;margin-bottom:6px">Select brands to compare</b>Choose 2–4 brands from the list to see positioning and the claim map side by side.</div>';$('evid').innerHTML='';return}
  const colW=Math.max(230,Math.floor(760/R.length));const th=`<thead><tr><th>Attribute</th>${R.map(b=>`<th style="width:${colW}px"><div class="rg">${esc(b.brand)}</div><div class="rt">${esc(b.company)}</div><div class="rb">${esc(b.audience)} · captured ${esc(fmt(b.captured))}</div></th>`).join('')}</tr></thead>`;
  const sec=t=>`<tr class="sec"><td colspan="${R.length+1}">${t}</td></tr>`;const row=(l,f,cls)=>`<tr class="${cls||''}"><td>${l}</td>${R.map(b=>`<td class="dc">${f(b)}</td>`).join('')}</tr>`;
  const none='<span class="na">—</span>';let h=sec('Positioning')+row('Positioning',b=>esc(b.positioning)||none)+row('Tagline',b=>b.tagline?'“'+esc(b.tagline)+'”':none)+row('Tone',b=>(b.tone||[]).map(t=>`<span class="pillx">${esc(t)}</span>`).join('')||none)+row('Differentiators',b=>(b.differentiators||[]).map(x=>'• '+esc(x)).join('<br>')||none)+row('Calls to action',b=>(b.cta||[]).map(x=>'• '+esc(x)).join('<br>')||none);
  h+=sec('Share of voice (claims by category)')+row('Mix',b=>{const n=b.claims.length||1;return `<div class="bar" title="Claims by category">${CATS.map((c,i)=>{const k=b.claims.filter(x=>x.cat===c).length;return k?`<i style="width:${k/n*100}%;background:${CC[i]}" title="${esc(c)}: ${k}"></i>`:''}).join('')}</div><small class="mute">${b.claims.length} claims</small>`})+row('Evidence-backed',b=>{const k=b.claims.filter(x=>STRONG.includes(x.ev)).length;return b.claims.length?`<b>${Math.round(k/b.claims.length*100)}%</b> <small class="mute">(${k} of ${b.claims.length}) cite trial data, real-world evidence or a guideline</small>`:none});
  h+=sec('Claim map');CATS.forEach((c,i)=>{const open=R.every(b=>!b.claims.some(x=>x.cat===c));h+=`<tr class="${open?'open':''}"><td><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${CC[i]};margin-right:6px"></span>${esc(c)}${open?'<br><span class="pillx warn">open space</span>':''}</td>${R.map(b=>{const cl=b.claims.filter(x=>x.cat===c);return `<td class="dc">${cl.length?cl.map(x=>`<div class="cl">${esc(x.text)}${x.q&&(x.ok||x.ver)?`<button class="ev" data-b="${esc(b.id)}" data-c="${esc(x.id)}" aria-label="Show evidence" type="button">i</button>`:''}<br><small>${esc(x.ev)}</small></div>`).join(''):'<span class="na">no claim</span>'}</td>`}).join('')}</tr>`});
  el.innerHTML=`<div class="twrap"><table class="ct"><colgroup><col style="width:170px">${R.map(()=>`<col style="width:${colW}px">`).join('')}</colgroup>${th}<tbody>${h}</tbody></table></div><div class="foot" style="padding:0 18px 4px;text-transform:none"><span>${CATS.map((c,i)=>`<i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${CC[i]};margin:0 4px 0 10px"></i>${esc(c)}`).join('')}</span></div>`;
  if(S.ev){const b=d.brands.find(x=>x.id===S.ev.b),c=b&&b.claims.find(x=>x.id===S.ev.c);const sr=c&&(d.sources.find(s=>s.id===c.src)||{});$('evid').innerHTML=c?`<div class="evc"><b>${esc(b.brand)} — ${esc(c.cat)}</b><q>“${esc(c.q)}”</q><span class="mute small">${esc(sr.label||'Brand page')}${sr.page?' ('+esc(sr.page)+')':''}${/^https?:\/\//.test(sr.url||'')?` · <a href="${esc(sr.url)}" target="_blank" rel="noopener noreferrer">open page</a>`:''}${c.ver?' · Verified by PharmSight analyst':''}</span></div>`:''}else $('evid').innerHTML=''}
function all(){pills();head();picker();table()}
$('aud').addEventListener('change',e=>{S.aud=e.target.value;picker()});$('rq').addEventListener('input',e=>{S.q=e.target.value;picker()});
$('rlist').addEventListener('change',e=>{const id=e.target.dataset.id;if(!id)return;const i=S.sel.indexOf(id);if(i>-1)S.sel.splice(i,1);else if(S.sel.length<4)S.sel.push(id);S.ev=null;picker();table()});
$('clearBtn').addEventListener('click',()=>{S.sel=[];S.ev=null;picker();table()});
$('body').addEventListener('click',e=>{const b=e.target.closest('.ev');if(!b)return;const same=S.ev&&S.ev.c===b.dataset.c;S.ev=same?null:{b:b.dataset.b,c:b.dataset.c};table()});
$('csvBtn').addEventListener('click',()=>{const d=ds(),R=S.sel.map(id=>d.brands.find(b=>b.id===id)).filter(Boolean);if(!R.length){toast('Select brands first');return}
  const rows=[['Attribute',...R.map(b=>b.brand+' ('+b.company+')')],['Audience',...R.map(b=>b.audience)],['Positioning',...R.map(b=>b.positioning)],['Tagline',...R.map(b=>b.tagline)],['Tone',...R.map(b=>(b.tone||[]).join('; '))],...CATS.map(c=>[c,...R.map(b=>b.claims.filter(x=>x.cat===c).map(x=>x.text+' ['+x.ev+']').join(' | '))])];downloadText('messaging-comparison.csv','\ufeff'+rows.map(r=>r.map(csvEsc).join(',')).join('\n'),'text/csv')});
$('prtBtn').addEventListener('click',()=>{try{window.print()}catch(e){toast('Print is blocked here')}});
bindNav();all();

</script></body></html>
